name: Staging Build and Deploy

on:
  push:
    branches: [ develop, staging ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache SPM
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Install dependencies
      run: |
        gem install bundler -v '~> 2.0'
        bundle install

    - name: Run tests
      run: |
        echo "🧪 Running tests via Fastlane..."
        bundle exec fastlane test
      continue-on-error: true

  build_and_deploy:
    name: Build and Deploy to TestFlight
    runs-on: macos-latest
    environment: FastLane
    needs: test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache SPM
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler: '2.6.9'
        bundler-cache: false

    - name: Install dependencies
      run: |
        echo "🔧 Ensuring bundler 2.6.9 is active..."
        gem install bundler -v '2.6.9' --force
        gem uninstall bundler -v '1.17.2' --force || echo "Bundler 1.17.2 not found"
        echo "📋 Bundle version info:"
        bundle --version
        echo "🚀 Installing gems..."
        bundle install

    - name: Set script permissions
      run: |
        echo "🔧 Setting execute permissions on scripts..."
        chmod +x scripts/*.sh
        ls -la scripts/

    - name: Setup certificates
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        FASTLANE_USER: senthilkumar.m@nexware-global.com
        FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        SPACESHIP_2FA_SMS_DEFAULT_PHONE_NUMBER: ${{ secrets.SPACESHIP_2FA_SMS_DEFAULT_PHONE_NUMBER }}
      run: |
        echo "🔐 Setting up certificates..."
        if [ -z "$MATCH_PASSWORD" ] || [ -z "$MATCH_GIT_BASIC_AUTHORIZATION" ]; then
          echo "⚠️ Certificate secrets not configured. Skipping certificate setup."
          echo "📋 To configure certificates:"
          echo "   1. Create repository: https://github.com/senthilinfo62/template-certificates"
          echo "   2. Add GitHub secrets: MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION"
          echo "   3. Run: bundle exec fastlane match development"
          echo "   4. Run: bundle exec fastlane match appstore"
        else
          echo "🔑 Certificate secrets found. Attempting certificate setup..."
          echo "🔧 First trying to sync existing certificates..."
          bundle exec fastlane certificates || {
            echo "⚠️ Certificate sync failed. Attempting to generate new certificates..."
            bundle exec fastlane generate_certificates || {
              echo "⚠️ Certificate generation failed. Attempting cleanup and regeneration..."
              bundle exec fastlane cleanup_certificates || echo "⚠️ Certificate cleanup failed. Will use local certificates if available."
            }
          }
        fi
      continue-on-error: true

    - name: Build and deploy staging
      env:
        FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        FASTLANE_USER: senthilkumar.m@nexware-global.com
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        SPACESHIP_2FA_SMS_DEFAULT_PHONE_NUMBER: ${{ secrets.SPACESHIP_2FA_SMS_DEFAULT_PHONE_NUMBER }}
        SLACK_URL: ${{ secrets.SLACK_URL }}
      run: |
        echo "🚀 Building staging version..."
        echo "🔐 Ensuring certificates are available..."
        bundle exec fastlane certificates || echo "⚠️ Certificate setup had issues, but continuing..."
        echo "📱 Starting staging build..."
        bundle exec fastlane staging || {
          echo "⚠️ Manual certificate signing failed. Trying automatic code signing..."
          bundle exec fastlane staging_auto
        }
      continue-on-error: true
