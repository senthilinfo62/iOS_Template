name: Security Checks

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'

# Cancel previous runs if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Check for hardcoded secrets
      run: |
        echo "🔍 Scanning for hardcoded secrets..."

        # Common patterns for secrets
        secret_patterns=(
          "password\s*=\s*['\"][^'\"]*['\"]"
          "api_key\s*=\s*['\"][^'\"]*['\"]"
          "secret\s*=\s*['\"][^'\"]*['\"]"
          "token\s*=\s*['\"][^'\"]*['\"]"
          "private_key"
          "-----BEGIN.*PRIVATE KEY-----"
          "sk_live_"
          "pk_live_"
          "AIza[0-9A-Za-z\\-_]{35}"
          "AKIA[0-9A-Z]{16}"
        )

        found_secrets=false

        for pattern in "${secret_patterns[@]}"; do
          matches=$(find . -name "*.swift" -not -path "./vendor/*" -not -path "./.build/*" -exec grep -Hn -i "$pattern" {} \; || true)
          if [ -n "$matches" ]; then
            echo "⚠️ Potential secret found with pattern '$pattern':"
            echo "$matches"
            found_secrets=true
          fi
        done

        if [ "$found_secrets" = true ]; then
          echo "::error::Potential hardcoded secrets found in code"
          exit 1
        else
          echo "✅ No hardcoded secrets detected"
        fi

    - name: Check for insecure network calls
      run: |
        echo "🌐 Checking for insecure network calls..."

        # Check for HTTP URLs (should use HTTPS)
        http_urls=$(find . -name "*.swift" -not -path "./vendor/*" -not -path "./.build/*" -exec grep -Hn "http://" {} \; || true)

        if [ -n "$http_urls" ]; then
          echo "⚠️ Found HTTP URLs (should use HTTPS):"
          echo "$http_urls"
          echo "::warning::HTTP URLs found - consider using HTTPS for security"
        else
          echo "✅ No insecure HTTP URLs found"
        fi

    - name: Check for weak cryptographic practices
      run: |
        echo "🔐 Checking for weak cryptographic practices..."

        # Check for weak encryption methods
        weak_crypto_patterns=(
          "MD5"
          "SHA1"
          "DES"
          "RC4"
          "ECB"
        )

        found_weak_crypto=false

        for pattern in "${weak_crypto_patterns[@]}"; do
          matches=$(find . -name "*.swift" -not -path "./vendor/*" -not -path "./.build/*" -exec grep -Hn "$pattern" {} \; || true)
          if [ -n "$matches" ]; then
            echo "⚠️ Weak cryptographic method '$pattern' found:"
            echo "$matches"
            found_weak_crypto=true
          fi
        done

        if [ "$found_weak_crypto" = true ]; then
          echo "::warning::Weak cryptographic methods found - consider using stronger alternatives"
        else
          echo "✅ No weak cryptographic methods detected"
        fi

    - name: Check for SQL injection vulnerabilities
      run: |
        echo "💉 Checking for potential SQL injection vulnerabilities..."

        # Check for string concatenation in SQL queries
        sql_patterns=(
          "SELECT.*\+.*"
          "INSERT.*\+.*"
          "UPDATE.*\+.*"
          "DELETE.*\+.*"
          "\"SELECT.*\\("
          "\"INSERT.*\\("
          "\"UPDATE.*\\("
          "\"DELETE.*\\("
        )

        found_sql_issues=false

        for pattern in "${sql_patterns[@]}"; do
          matches=$(find . -name "*.swift" -not -path "./vendor/*" -not -path "./.build/*" -exec grep -Hn "$pattern" {} \; || true)
          if [ -n "$matches" ]; then
            echo "⚠️ Potential SQL injection vulnerability with pattern '$pattern':"
            echo "$matches"
            found_sql_issues=true
          fi
        done

        if [ "$found_sql_issues" = true ]; then
          echo "::warning::Potential SQL injection vulnerabilities found - use parameterized queries"
        else
          echo "✅ No SQL injection vulnerabilities detected"
        fi

    - name: Check for unsafe file operations
      run: |
        echo "📁 Checking for unsafe file operations..."

        # Check for potentially unsafe file operations
        unsafe_patterns=(
          "FileManager.*removeItem.*\+"
          "FileManager.*createFile.*\+"
          "\.write.*toFile.*\+"
          "NSString.*writeToFile.*\+"
        )

        found_unsafe_ops=false

        for pattern in "${unsafe_patterns[@]}"; do
          matches=$(find . -name "*.swift" -not -path "./vendor/*" -not -path "./.build/*" -exec grep -Hn "$pattern" {} \; || true)
          if [ -n "$matches" ]; then
            echo "⚠️ Potentially unsafe file operation with pattern '$pattern':"
            echo "$matches"
            found_unsafe_ops=true
          fi
        done

        if [ "$found_unsafe_ops" = true ]; then
          echo "::warning::Potentially unsafe file operations found - validate file paths"
        else
          echo "✅ No unsafe file operations detected"
        fi

    - name: Check dependencies for known vulnerabilities
      run: |
        echo "📦 Checking dependencies for known vulnerabilities..."

        # Check if Package.resolved exists
        if [ -f "template.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" ]; then
          echo "📋 Analyzing SPM dependencies..."

          # Simple dependency check without embedded scripts
          echo "📦 Found dependencies:"
          if command -v jq >/dev/null 2>&1; then
            jq -r '.pins[] | "  - \(.identity) v\(.state.version // "Unknown") (\(.location))"' template.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || echo "Could not parse dependencies"
          else
            echo "📦 Dependencies found in Package.resolved"
            grep -E "(identity|version)" template.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || true
          fi

          # Check for Alamofire version
          if grep -q '"alamofire"' template.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "✅ Alamofire dependency found"
            if grep -A5 '"alamofire"' template.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | grep -q '"version" : "4\.'; then
              echo "⚠️ Warning: Alamofire v4.x has known vulnerabilities, consider upgrading"
            fi
          fi
        else
          echo "⚠️ No Package.resolved found"
        fi

    - name: Check for debug code in production
      run: |
        echo "🐛 Checking for debug code that shouldn't be in production..."

        # Check for debug-related code
        debug_patterns=(
          "NSLog"
          "debugPrint"
          "dump("
          "#if DEBUG"
          "assert("
          "assertionFailure"
          "precondition"
          "fatalError"
        )

        found_debug_code=false

        for pattern in "${debug_patterns[@]}"; do
          matches=$(find . -name "*.swift" -not -path "./vendor/*" -not -path "./.build/*" -not -path "./template/Debug/*" -exec grep -Hn "$pattern" {} \; || true)
          if [ -n "$matches" ]; then
            echo "ℹ️ Debug code found with pattern '$pattern':"
            echo "$matches"
            # Don't fail for debug code, just warn
          fi
        done

        echo "✅ Debug code check completed"

    - name: Validate Info.plist security settings
      run: |
        echo "📋 Validating Info.plist security settings..."

        # Check for Info.plist files
        info_plists=$(find . -name "Info.plist" -not -path "./vendor/*" || true)

        if [ -n "$info_plists" ]; then
          for plist in $info_plists; do
            echo "Checking $plist..."

            # Check for App Transport Security
            if ! grep -q "NSAppTransportSecurity" "$plist"; then
              echo "⚠️ No App Transport Security configuration found in $plist"
              echo "::warning::Consider adding App Transport Security configuration"
            fi

            # Check for arbitrary loads
            if grep -q "NSAllowsArbitraryLoads.*true" "$plist"; then
              echo "⚠️ Arbitrary loads enabled in $plist - this reduces security"
              echo "::warning::Arbitrary loads enabled - consider restricting network access"
            fi
          done
        else
          echo "ℹ️ No Info.plist files found"
        fi

    - name: Generate security report
      if: always()
      run: |
        ./scripts/generate_security_report.sh

    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md
        retention-days: 30
